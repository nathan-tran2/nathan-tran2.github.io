<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <rect width="800" height="600" fill="#1F2734"/>

  <!-- the loop -->
  <circle cx="400" cy="300" r="190" fill="none" stroke="#2B3442" stroke-width="5"/>
  <path d="M248 186 A190 190 0 0 1 552 186" fill="none" stroke="#45CFC2" stroke-width="7" stroke-linecap="round"/>
  <path d="M590 300 A190 190 0 0 1 470 476" fill="none" stroke="#45CFC2" stroke-width="7" stroke-linecap="round" opacity=".7"/>
  <path d="M330 476 A190 190 0 0 1 210 300" fill="none" stroke="#F0876C" stroke-width="7" stroke-linecap="round" opacity=".85"/>
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M534 162l20 24-30 6" stroke="#45CFC2"/>
    <path d="M500 470l-30 6 8 -28" stroke="#45CFC2" opacity=".7"/>
    <path d="M196 326l14 -26 16 24" stroke="#F0876C" opacity=".85"/>
  </g>

  <!-- headset, top -->
  <rect x="320" y="70" width="160" height="82" rx="30" fill="#10141C" stroke="#45CFC2" stroke-width="7"/>
  <rect x="344" y="92" width="48" height="38" rx="12" fill="#45CFC2" opacity=".35"/>
  <rect x="408" y="92" width="48" height="38" rx="12" fill="#45CFC2" opacity=".35"/>

  <!-- adaptation controls, right -->
  <g transform="translate(560 300)">
    <rect x="-70" y="-62" width="140" height="124" rx="18" fill="#10141C" stroke="#45CFC2" stroke-width="6"/>
    <g stroke="#93A2B5" stroke-width="6" stroke-linecap="round" opacity=".6">
      <path d="M-44 -30h88"/><path d="M-44 0h88"/><path d="M-44 30h88"/>
    </g>
    <circle cx="-14" cy="-30" r="11" fill="#45CFC2"/>
    <circle cx="22" cy="0" r="11" fill="#45CFC2"/>
    <circle cx="-30" cy="30" r="11" fill="#45CFC2"/>
  </g>

  <!-- physiological signal, left -->
  <g transform="translate(240 300)">
    <rect x="-70" y="-62" width="140" height="124" rx="18" fill="#10141C" stroke="#F0876C" stroke-width="6"/>
    <path d="M-50 4h22l12 -30 16 54 14 -40 10 16h26" fill="none" stroke="#F0876C" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- person, centre bottom -->
  <circle cx="400" cy="440" r="26" fill="#10141C" stroke="#45CFC2" stroke-width="7"/>
  <path d="M352 548c4-40 24-62 48-62s44 22 48 62" fill="#10141C" stroke="#45CFC2" stroke-width="7" stroke-linecap="round"/>
</svg>
